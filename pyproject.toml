[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hive-cli"
version = "0.1.0"
description = "Terminal-first polyrepo coordinator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Mostly Good Metrics" }
]
dependencies = [
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
web = [
    "aiohttp>=3.9.0",
]

[project.scripts]
hive = "hive.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hive"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
